name: Cubic downstream contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Check downstream contracts
        run: uv run --no-project --python 3.12 tools/check_cubic_downstream.py
